services:
  postgres:
    image: postgres:16-alpine
    container_name: kelvjessia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kelvjessia
      POSTGRES_USER: kelvjessia
      POSTGRES_PASSWORD: kelvjessia_dev_password
    ports:
      - "5432:5432"
    volumes:
      - kelvjessia_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kelvjessia -d kelvjessia"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  kelvjessia_postgres:
